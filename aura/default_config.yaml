# Aura defaults. Do not edit this file: put your changes in
#   %APPDATA%\Aura\config.yaml   (run "aura config" to open it)
# Only the keys you write there are overridden; everything else stays as below.

assistant:
  name: Aura
  browser: edge            # "edge" or "default"

voice:
  wake_word: hey_jarvis    # built-in models: hey_jarvis, alexa, hey_mycroft, hey_rhasspy
  wake_threshold: 0.5      # at or above this score Aura wakes at once; raise (0.6-0.7) if it wakes by accident
  # A score between wake_verify_threshold and wake_threshold is a "maybe": the last two seconds are
  # transcribed on the laptop and Aura wakes only if the wake word is in the text. This catches
  # voices and microphones the wake model scores low, without waking on other speech. 1 turns it off.
  wake_verify_threshold: 0.1
  stt_model: base.en       # tiny.en (fastest) | base.en | small.en (most accurate)
  stt_threads: 4           # processor threads for speech-to-text
  max_command_seconds: 12
  silence_seconds: 0.6     # pause that ends a sentence (one or two words always get 0.9 s)
  follow_up: true          # after answering, keep listening so you can reply without the wake word
  follow_up_seconds: 6     # ... for this long; silence, "stop" or "thanks" ends the conversation
  follow_up_cue: true      # short low beep when Aura is listening for the follow-up
  # Cutting Aura off while it talks:  hotkey = push-to-talk only | voice = also by speaking over it | off
  barge_in: hotkey
  speech_rate: 1           # -10 (slow) .. 10 (fast)
  listen_when_locked: false
  hotkey_talk: ctrl+alt+space   # push-to-talk, no wake word needed
  hotkey_mute: ctrl+alt+m       # microphone on/off (privacy switch)

brain:
  # auto        : Claude Code CLI (your Claude subscription) if found, else API key, else built-in phrases
  # claude_cli  : always the Claude Code CLI
  # api         : Anthropic API key stored with "aura secret set anthropic_api_key"
  # none        : built-in phrases and routines only; nothing ever leaves the laptop
  provider: auto
  # How to start Claude Code. Native Windows install: [claude]
  # Installed inside Kali on WSL:  [wsl, -d, kali-linux, --, bash, -lic]
  claude_command: [claude]
  # Claude Code is started with flags that switch off your personal Claude Code setup
  # (hooks, CLAUDE.md, plugins, skills, MCP). It still uses your Claude Code sign-in.
  claude_model: haiku       # fastest for turning a spoken request into actions; "" = your Claude Code default
  claude_effort: low        # low | medium | high; "" = the model's default
  keep_warm: true           # keep one Claude Code process started and waiting, so replies come in 1-2 s
  api_model: claude-opus-5-5
  timeout_seconds: 20       # per try; a try that hangs or dies is repeated once

files:
  roots: ["~/Documents", "~/Desktop", "~/Downloads", "~/Pictures"]   # Aura cannot touch anything else
  notes_dir: "~/Documents/Aura Notes"
  screenshots_dir: "~/Pictures/Aura Screenshots"
  max_read_kb: 200

# Spoken name -> what to start. "process" lets Aura close it too.
apps:
  edge: {open: msedge, process: msedge.exe}
  browser: {open: msedge, process: msedge.exe}
  notepad: {open: notepad, process: notepad.exe}
  calculator: {open: calc}
  file explorer: {open: explorer}
  explorer: {open: explorer}
  settings: {open: "ms-settings:"}
  terminal: {open: wt, process: WindowsTerminal.exe}
  task manager: {open: taskmgr}
  paint: {open: mspaint, process: mspaint.exe}
  kali: {open: wsl, args: "-d kali-linux"}
  kali linux: {open: wsl, args: "-d kali-linux"}
  # Anything else is looked up in the Start Menu by name (e.g. "open Claude").

# Spoken name -> website. {q} is replaced by the search words.
sites:
  gmail: {url: "https://mail.google.com", search: "https://mail.google.com/mail/u/0/#search/{q}"}
  calendar: {url: "https://calendar.google.com"}
  github: {url: "https://github.com", search: "https://github.com/search?q={q}"}
  linkedin: {url: "https://www.linkedin.com", search: "https://www.linkedin.com/jobs/search/?keywords={q}"}
  naukri: {url: "https://www.naukri.com", search: "https://www.naukri.com/{q_dash}-jobs"}
  muse: {url: "https://www.themuse.com"}
  gemini: {url: "https://gemini.google.com/app"}
  chatgpt: {url: "https://chatgpt.com", search: "https://chatgpt.com/?q={q}"}
  claude: {url: "https://claude.ai/new", search: "https://claude.ai/new?q={q}"}
  google: {url: "https://www.google.com", search: "https://www.google.com/search?q={q}"}
  youtube: {url: "https://www.youtube.com", search: "https://www.youtube.com/results?search_query={q}"}

# Named commands you trust, run in a visible window after a spoken "yes". Example:
#   update kali: [wsl, -d, kali-linux, --, sudo, apt, update]
commands: {}

# Say the name ("job hunt", or "run job hunt") to run every step in order.
routines:
  good morning:
    - say: "Good morning."
    - tool: get_time
      speak: true
    - tool: system_status
      speak: true
    - tool: reminders_list
      speak: true
    - tool: open_site
      args: {name: gmail}
    - tool: open_site
      args: {name: calendar}
  job hunt:
    - say: "Opening your job sites."
    - tool: open_site
      args: {name: linkedin}
    - tool: open_site
      args: {name: naukri}
    - tool: open_site
      args: {name: muse}
    - tool: open_site
      args: {name: gmail}
  focus mode:
    - tool: volume_set
      args: {level: 15}
    - say: "Focus mode on."
  coding setup:
    - tool: open_app
      args: {name: kali}
    - tool: open_site
      args: {name: github}
    - tool: open_site
      args: {name: claude}
  wrap up:
    - tool: note_add
      args: {text: "Wrapped up for the day."}
    - tool: lock_screen

# Automatic reactions. "event" = an event published by another part of Aura; "at" = a clock time.
rules:
  - name: low battery warning
    event: battery.low
    do:
      - say: "Battery is at {percent} percent. Please plug in."
  - name: reminder announcer
    event: reminder.due
    do:
      - say: "Reminder: {text}"
  # - name: start of day
  #   at: "09:00"
  #   days: [mon, tue, wed, thu, fri]
  #   do:
  #     - routine: good morning

monitors:
  battery_low_percent: 20

policy:
  max_tool_calls_per_request: 12
  # Change any action's level: safe | confirm | critical | blocked
  overrides: {}
