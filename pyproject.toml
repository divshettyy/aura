[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-assistant"
version = "1.0.0"
description = "Voice-controlled, automated, locally-secured laptop assistant for Windows"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0.3,<7",
  "numpy>=2.2.6,<3",
  "psutil>=7.2.2,<8",
  "keyring>=25.7.0,<26",
  "anthropic>=2.9.0,<3",
  "faster-whisper>=1.2.1,<2",
  "openwakeword>=0.6,<0.7",
  "onnxruntime>=1.24.3,<2",
  "sounddevice>=0.5.6,<1",
  "pywin32>=312; sys_platform == 'win32'",
  "pycaw>=20260927; sys_platform == 'win32'",
  "comtypes>=1.5.0,<2; sys_platform == 'win32'",
  "screen-brightness-control>=0.27.2,<1; sys_platform == 'win32'",
  "pillow>=12.3.0,<14; sys_platform == 'win32'",
  "pyperclip>=1.11.0,<2; sys_platform == 'win32'",
  "send2trash>=2.2.0,<3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
aura = "aura.__main__:main"

[tool.setuptools]
packages = ["aura", "aura.brain", "aura.voice", "aura.skills", "aura.platform"]

[tool.setuptools.package-data]
aura = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use lambda stubs and compact one-line setups deliberately.
"tests/*" = ["E731", "E702", "E741"]
